services:
  - type: web
    name: yp-notify-be
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: npx tsx src/server.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: NOTIFY_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: SQLITE_PATH
        value: ./data.sqlite
